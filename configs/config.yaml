# =====================================================================
# Master configuration for the Parameter-Efficient Hybrid Quantum-Classical
# Brain Tumor MRI Classification project.
#
# Point `data.root` at the real dataset directory (ImageFolder layout:
# root/<class_name>/*.jpg) — e.g. the Kaggle "Brain Tumor MRI Dataset"
# (masoudnickparvar/brain-tumor-mri-dataset, 4 classes: glioma, meningioma,
# notumor, pituitary). Nothing else needs to change to run on real data.
# =====================================================================

project:
  name: "hybrid-qcnn-brain-tumor"
  seed: 42
  seeds_for_stats: [42, 1, 7]   # multiple seeds for mean +/- std reporting
  device: "auto"                # "auto" | "cpu" | "cuda"
  results_dir: "results"

data:
  root: "data/raw"              # ImageFolder layout: root/<class>/*.jpg
  synthetic_fallback: true      # if root has no data, generate a small
                                 # synthetic placeholder set (see data/synthetic_data_generator.py)
  image_size: 96                # resized square input size
  channels: 3
  val_frac: 0.15
  test_frac: 0.15
  patient_level_split: true     # patient-level split if patient IDs are inferable, else stratified image-level
  batch_size: 16
  num_workers: 0        # sandbox is CPU-only with limited cores; raise this on real hardware
  augmentation:
    horizontal_flip: true
    rotation_degrees: 10
    brightness_jitter: 0.1
  class_imbalance_strategy: "weighted_sampler"  # "weighted_sampler" | "class_weighted_loss" | "none"

classical_backbone:
  architecture: "mobilenet_v2"   # "simple_cnn" | "resnet18" | "mobilenet_v2"
  pretrained: false  # set true on real hardware with internet access to download ImageNet weights;
                      # this sandbox's network allowlist blocks download.pytorch.org (verified: HTTP 403)
  freeze_backbone: false
  feature_dim: 1280              # output of backbone before reduction head
  reduced_dim: 8                 # dimensionality reduction target -> quantum input

graph:
  n_segments: 32
  compactness: 10.0
  hidden_dim: 32
  num_layers: 2

quantum:
  framework: "pennylane"
  n_qubits: 4
  n_layers: 2
  encoding: "angle"              # "angle" | "amplitude"
  entanglement: "circular"       # "circular" | "linear" | "full"
  data_reuploading: true
  diff_method: "backprop"        # fast simulator-friendly gradient
  device_name: "default.qubit"
  noise_type: "ideal"            # "ideal" | "bit_flip" | "phase_flip" | "depolarizing"
  noise_prob: 0.0                # Noise probability (0.0 = no noise)

training:
  epochs: 3                # smoke-test scale for CPU sandbox; raise for real runs
  lr: 0.001
  optimizer: "adam"
  weight_decay: 0.0001
  scheduler: "cosine"
  early_stopping_patience: 5
  grad_clip: 1.0

baselines:
  - simple_cnn
  - resnet18
  - mobilenet_v2
  - classical_proposed   # classical-only version of the proposed architecture (no VQC)

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1_macro", "f1_weighted", "roc_auc_ovr", "specificity"]
  n_runs_for_stats: 3

logging:
  save_checkpoints: true
  log_every_n_steps: 10

# Member 3 Experimental Configuration
ablation_experiments:
  qubit_counts: [2, 4, 6]
  layer_counts: [1, 2, 4]
  reuploading_options: [true, false]
  models: ["hybrid"]
  representations: ["cnn", "gnn"]

noise_experiments:
  noise_types: ["ideal", "bit_flip", "phase_flip", "depolarizing"]
  noise_probabilities: [0.0, 0.01, 0.05, 0.1]
  models: ["hybrid"]
  representations: ["cnn", "gnn"]

explainability:
  cnn:
    method: "gradcam"              # "gradcam" | "gradcam++"
    num_samples: 10
  gnn:
    num_samples: 10
    epochs: 100
    lr: 0.01

cross_dataset:
  # Define dataset pairs for train-on-A/test-on-B experiments
  # Format: source_dataset: target_dataset
  dataset_pairs: []
  # Example: ["data/source_dataset: data/target_dataset"]
  
  # Alternative: specify separate source and target lists
  source_datasets: []
  target_datasets: []

statistical_analysis:
  primary_metric: "accuracy"
  confidence_level: 0.95
  metrics_to_analyze: ["accuracy", "f1_macro", "precision_macro", "recall_macro"]
