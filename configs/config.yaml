# =====================================================================
# Master configuration for the Parameter-Efficient Hybrid Quantum-Classical
# Brain Tumor MRI Classification project.
#
# Point `data.root` at the real dataset directory (ImageFolder layout:
# root/<class_name>/*.jpg) — e.g. the Kaggle "Brain Tumor MRI Dataset"
# (masoudnickparvar/brain-tumor-mri-dataset, 4 classes: glioma, meningioma,
# notumor, pituitary). Nothing else needs to change to run on real data.
#
# Step 1 additions: two-stage fine-tuning schedule (training.warmup_epochs,
# training.head_lr, training.backbone_lr) and label smoothing
# (training.label_smoothing). See train.py for how these are consumed.
# =====================================================================

project:
  name: "hybrid-qcnn-brain-tumor"
  seed: 42
  seeds_for_stats: [42, 1, 7]   # multiple seeds for mean +/- std reporting
  device: "auto"                # "auto" | "cpu" | "cuda"
  results_dir: "results"

data:
  root: "data/raw"              # ImageFolder layout: root/<class>/*.jpg
  synthetic_fallback: false      # real Kaggle run: disable synthetic placeholders
  image_size: 96                # resized square input size
  channels: 3
  val_frac: 0.15
  test_frac: 0.15
  patient_level_split: true     # patient-level split if patient IDs are inferable, else stratified image-level
  margin_crop: false          
  num_workers: 0                # raise this on real hardware if needed
  augmentation:
    horizontal_flip: true
    rotation_degrees: 10
    brightness_jitter: 0.1
  class_imbalance_strategy: "weighted_sampler"  # "weighted_sampler" | "class_weighted_loss" | "none"

classical_backbone:
  architecture: "mobilenet_v2"   # "simple_cnn" | "resnet18" | "mobilenet_v2"
  pretrained: true                # use ImageNet weights for real Kaggle dataset
  freeze_backbone: false          # NOTE: superseded by training.warmup_epochs for
                                   # hybrid/classical_proposed/resnet18/mobilenet_v2 —
                                   # train.py freezes/unfreezes dynamically instead.
  feature_dim: 1280              # output of backbone before reduction head
  reduced_dim: 8                 # dimensionality reduction target -> quantum input

graph:
  n_segments: 32
  compactness: 10.0
  hidden_dim: 32
  num_layers: 2

fusion:
  # Step 2: Cross-Attention CNN+GNN Fusion (models/fusion.py). Only used
  # when running `--model hybrid --representation fusion`.
  d_model: 64            # cross-attention embedding dim (CNN tokens & GNN node queries)
  n_attention_heads: 4
  d_fusion: 64            # dim after gated fusion of CNN-global + graph-informed vectors
  readout: "xyz"          # VQC readout: "z" (Step 1 default, n_qubits outputs) | "xyz" (3x n_qubits outputs)

quantum:
  framework: "pennylane"
  n_qubits: 8
  n_layers: 3
  encoding: "angle"              # "angle" | "amplitude"
  entanglement: "circular"       # "circular" | "linear" | "full"
  data_reuploading: true
  diff_method: "backprop"        # fast simulator-friendly gradient
  device_name: "default.qubit"
  noise_type: "ideal"            # "ideal" | "bit_flip" | "phase_flip" | "depolarizing"
  noise_prob: 0.0                # Noise probability (0.0 = no noise)

training:
  epochs: 30                # total epochs across BOTH phases (warmup + fine-tune)
  warmup_epochs: 3           # Phase A: backbone frozen, head-only, at head_lr
  lr: 0.0001                # fallback LR for models with no pretrained backbone (simple_cnn, gnn)
  head_lr: 0.001             # Phase A LR and Phase B head-group LR
  backbone_lr: 0.00001       # Phase B backbone-group LR (10x lower than head)
  label_smoothing: 0.05      # 0.0 disables; helps generalization on ~7k-image dataset
  optimizer: "adam"
  weight_decay: 0.0001
  scheduler: "cosine"        # cosine anneal applied within Phase B (and single-phase runs)
  early_stopping_patience: 6 # counted across the whole run, not per-phase
  grad_clip: 1.0              # NOTE: not yet wired into train.py's optimizer step — see Step 2/3

baselines:
  - simple_cnn
  - resnet18
  - mobilenet_v2
  - classical_proposed   # classical-only version of the proposed architecture (no VQC)

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1_macro", "f1_weighted", "roc_auc_ovr", "specificity"]
  n_runs_for_stats: 3

logging:
  save_checkpoints: true
  log_every_n_steps: 10

# Member 3 Experimental Configuration
ablation_experiments:
  qubit_counts: [2, 4, 6]
  layer_counts: [1, 2, 4]
  reuploading_options: [true, false]
  models: ["hybrid"]
  representations: ["cnn", "gnn"]

noise_experiments:
  noise_types: ["ideal", "bit_flip", "phase_flip", "depolarizing"]
  noise_probabilities: [0.0, 0.01, 0.05, 0.1]
  models: ["hybrid"]
  representations: ["cnn", "gnn"]

explainability:
  cnn:
    method: "gradcam"              # "gradcam" | "gradcam++"
    num_samples: 10
  gnn:
    num_samples: 10
    epochs: 100
    lr: 0.01

cross_dataset:
  # Define dataset pairs for train-on-A/test-on-B experiments
  # Format: source_dataset: target_dataset
  dataset_pairs: []
  # Example: ["data/source_dataset: data/target_dataset"]

  # Alternative: specify separate source and target lists
  source_datasets: []
  target_datasets: []

statistical_analysis:
  primary_metric: "accuracy"
  confidence_level: 0.95
  metrics_to_analyze: ["accuracy", "f1_macro", "precision_macro", "recall_macro"]